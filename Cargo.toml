[package]
name = "dtmbd"
version = "0.1.0"
edition = "2024"
description = "DTMB/DMB-TH USB stick → IPTV (M3U / MPEG-TS) for Raspberry Pi. No kernel driver, no transcoding."
license = "GPL-2.0-or-later"
repository = "https://github.com/tychenjiajun/dtmbd"
homepage = "https://github.com/tychenjiajun/dtmbd"
keywords = ["dtmb", "iptv", "m3u", "raspberry-pi", "mpegts"]
categories = ["multimedia::video", "hardware-support", "command-line-utilities"]
readme = "README.md"
rust-version = "1.85"
# crates.io: keep the tarball small; screenshots live on GitHub
exclude = ["docs/", "*.ts", "*.yuv", ".DS_Store"]

[features]
# `cargo install dtmbd --features vendored` builds libusb from source, so no
# libusb-1.0-dev / pkg-config is needed on the target machine.
default = []
vendored = ["rusb/vendored"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
mdns-sd = "0.21.6"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
